<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche mission</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
.pb *{box-sizing:border-box}
.pb button{font-family:inherit;cursor:pointer}
.pb .ibtn{width:48px;height:48px;border-radius:16px;border:0;background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.pb .lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.pb .card{background:var(--surf);border-radius:24px;box-shadow:var(--shadow);padding:14px 16px}
.pb .sum{display:flex;align-items:center;gap:10px;min-height:40px}
.pb .dot{width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:700}
.pb .opt{flex:1;height:44px;border-radius:14px;border:0;background:var(--surf2);color:var(--mute);font-size:13px;font-weight:700}
.pb .mic{width:48px;height:48px;border-radius:16px;border:0;background:var(--accSoft);color:var(--acc);display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="pb" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;{{vars}}">

<div style="position:absolute;left:20px;right:20px;top:24px;display:flex;gap:10px;align-items:center">
<button class="ibtn" aria-label="Retour aux missions"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<div style="flex:1;min-width:0">
<div class="lbl">Fiche mission</div>
<div style="font-family:'Sora',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Zone industrielle Sud</div>
</div>
<button class="ibtn" aria-label="Renommer la mission"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
</div>

<div style="position:absolute;left:20px;right:20px;top:88px;display:flex;flex-direction:column;gap:10px">

<div class="card" style="padding:10px 16px">
<div class="sum"><span class="dot" style="background:var(--goSoft);color:var(--go)">✓</span><span style="flex:1;font-weight:700">Lieu</span><span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mute)">43.6045, 1.4442</span></div>
<div class="sum"><span class="dot" style="background:var(--goSoft);color:var(--go)">✓</span><span style="flex:1;font-weight:700">Météo 14:00–16:30</span><span style="font-weight:700;color:var(--go)">GO</span></div>
<div class="sum"><span class="dot" style="background:var(--warnSoft);color:var(--warn)">!</span><span style="flex:1;font-weight:700">Espace aérien</span><span style="font-weight:700;color:var(--warn)">Zone contrôlée</span></div>
</div>

<div style="display:flex;gap:10px">
<div class="card" style="flex:1;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div><div style="font-family:'Sora',sans-serif;font-weight:700;font-size:19px">SMEPP</div><div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mute);margin-top:2px">3 / 9</div></div>
<button class="mic" aria-label="Dicter le SMEPP"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
</div>
<div style="height:6px;border-radius:99px;background:var(--surf2)"><div style="width:33%;height:100%;border-radius:99px;background:var(--acc)"></div></div>
</div>
<div class="card" style="flex:1;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div><div style="font-family:'Sora',sans-serif;font-weight:700;font-size:19px">MACLOE</div><div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mute);margin-top:2px">0 / 6</div></div>
<button class="mic" aria-label="Dicter le MACLOE"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
</div>
<div style="height:6px;border-radius:99px;background:var(--surf2)"></div>
</div>
</div>

<div class="card" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:'Sora',sans-serif;font-weight:700;font-size:18px">GENDRONE</span><span style="font-size:13px;font-weight:600;color:var(--mute)">demande de vol</span></div>
<div style="display:flex;gap:6px">
<button class="opt">À faire</button>
<button class="opt">Envoyée</button>
<button class="opt" style="background:var(--go);color:var(--bg)">✓ Acceptée</button>
</div>
</div>

<div class="card" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:'Sora',sans-serif;font-weight:700;font-size:18px">Visu@ldrone</span><span style="font-size:13px;font-weight:600;color:var(--mute)">déclaration de vol</span></div>
<div style="display:flex;gap:6px">
<button class="opt" style="background:var(--warn);color:var(--bg)">À faire</button>
<button class="opt">Déclaré</button>
<button class="opt">Clos</button>
</div>
</div>

<div style="font-size:12px;font-weight:600;color:var(--mute);padding:0 6px">Statuts suivis à la main : l'appli ne se connecte pas à GENDRONE ni Visu@ldrone.</div>

</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to bottom,transparent,var(--bg) 40%)"></div>
<div style="position:absolute;left:20px;right:20px;bottom:24px;display:flex;gap:12px">
<button aria-label="Exporter la mission" style="width:64px;height:64px;border-radius:22px;border:0;background:var(--surf);color:var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button>
<button style="flex:1;height:64px;border-radius:22px;border:0;background:var(--acc);color:var(--accInk);font-family:'Sora',sans-serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>Copier le récapitulatif</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const base = dark
      ? '--bg:#090D12;--surf:#131A22;--surf2:#1B242E;--line:#2A3541;--ink:#EEF3F7;--mute:#9AA9B8;--acc:#B9F23A;--accInk:#0B1304;--accSoft:#232F0C;--go:#3EE58C;--goSoft:#0F2E1E;--warn:#FFB020;--warnSoft:#34260A;--bad:#FF7A6E;--badSoft:#3A1814;--shadow:0 6px 24px rgba(0,0,0,.45);'
      : '--bg:#EEF0EA;--surf:#FFFFFF;--surf2:#F2F4EE;--line:#DDE1D6;--ink:#0D1218;--mute:#566170;--acc:#2340E8;--accInk:#FFFFFF;--accSoft:#E3E8FF;--go:#0D7A40;--goSoft:#D8F1E1;--warn:#8A5200;--warnSoft:#FBE9C6;--bad:#B3261E;--badSoft:#F9DAD6;--shadow:0 6px 24px rgba(13,18,24,.10);';
    return { vars: base };
  }
}
</script>
</body>
</html>
