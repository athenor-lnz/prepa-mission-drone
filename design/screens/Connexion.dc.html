<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
.pb *{box-sizing:border-box}
.pb button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div class="pb" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;{{vars}}">

<svg width="390" height="440" viewBox="0 0 390 440" style="position:absolute;left:0;top:0" aria-hidden="true">
<g fill="none" stroke="var(--acc)" stroke-width="1.5">
<circle cx="195" cy="210" r="60" opacity=".55"/>
<circle cx="195" cy="210" r="110" opacity=".35"/>
<circle cx="195" cy="210" r="160" opacity=".2"/>
<circle cx="195" cy="210" r="210" opacity=".1"/>
<path d="M195 10v400M-5 210h400" opacity=".15"/>
</g>
<path d="M195 210 L 195 50 A 160 160 0 0 1 308 97 Z" fill="var(--acc)" opacity=".14"/>
<circle cx="278" cy="132" r="6" fill="var(--acc)"/>
<circle cx="120" cy="260" r="4" fill="var(--acc)" opacity=".6"/>
</svg>

<div style="position:absolute;left:0;right:0;top:150px;display:flex;flex-direction:column;align-items:center;gap:14px">
<div style="width:72px;height:72px;border-radius:24px;background:var(--acc);color:var(--accInk);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)">
<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3"/></svg>
</div>
<h1 style="margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.03em">Prépa Mission</h1>
<div style="color:var(--mute);font-weight:600">Préparation de vol drone</div>
</div>

<div style="position:absolute;left:0;right:0;top:420px;bottom:0;background:var(--surf);border-radius:32px 32px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.12);padding:28px 20px 24px;display:flex;flex-direction:column;gap:14px">
<label for="mdp" style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)">Mot de passe d'accès</label>
<div style="display:flex;align-items:center;height:64px;border-radius:20px;background:var(--surf2);border:2px solid var(--bad);padding:0 8px 0 18px">
<input id="mdp" type="password" value="testtest" style="flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:20px;outline:none">
<button aria-label="Afficher le mot de passe" style="width:48px;height:48px;border:0;border-radius:14px;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<div role="alert" style="display:flex;align-items:center;gap:10px;background:var(--badSoft);color:var(--bad);border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/></svg>
Mot de passe incorrect. Réessayez.
</div>
<div style="font-size:13px;font-weight:600;color:var(--mute);line-height:1.45">Verrou léger, il ne protège pas des données sensibles. N'enregistrez aucune information classifiée.</div>
<button style="margin-top:auto;height:64px;border-radius:22px;border:0;background:var(--acc);color:var(--accInk);font-family:'Sora',sans-serif;font-weight:700;font-size:18px">Entrer</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const base = dark
      ? '--bg:#090D12;--surf:#131A22;--surf2:#1B242E;--line:#2A3541;--ink:#EEF3F7;--mute:#9AA9B8;--acc:#B9F23A;--accInk:#0B1304;--bad:#FF7A6E;--badSoft:#3A1814;--shadow:0 6px 24px rgba(0,0,0,.45);'
      : '--bg:#EEF0EA;--surf:#FFFFFF;--surf2:#F2F4EE;--line:#DDE1D6;--ink:#0D1218;--mute:#566170;--acc:#2340E8;--accInk:#FFFFFF;--bad:#B3261E;--badSoft:#F9DAD6;--shadow:0 6px 24px rgba(13,18,24,.10);';
    return { vars: base };
  }
}
</script>
</body>
</html>
