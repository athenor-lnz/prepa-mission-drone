<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Outils de conversion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
.pb *{box-sizing:border-box}
.pb button{font-family:inherit;cursor:pointer}
.pb .lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.pb .chipb{height:44px;padding:0 18px;border-radius:99px;border:0;background:var(--surf2);color:var(--ink);font-size:15px;font-weight:700}
.pb .key{height:54px;border-radius:18px;border:0;background:var(--surf2);color:var(--ink);font-family:'Sora',sans-serif;font-weight:600;font-size:22px;display:flex;align-items:center;justify-content:center}
.pb .res{display:flex;align-items:center;gap:12px;height:48px;padding:0 4px 0 16px;border-radius:16px;background:var(--surf2)}
.pb .ru{width:44px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:14px;color:var(--mute)}
.pb .rv{flex:1;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:20px}
.pb .cp{width:44px;height:44px;border:0;background:transparent;color:var(--acc);display:flex;align-items:center;justify-content:center;border-radius:14px}
</style>
</helmet>
<div class="pb" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;{{vars}}">

<div style="position:absolute;inset:0;background:var(--scrim)"></div>
<div style="position:absolute;left:20px;right:20px;top:24px;height:40px;border-radius:16px;background:var(--surf);opacity:.5"></div>

<div style="position:absolute;left:0;right:0;top:76px;bottom:0;background:var(--surf);border-radius:32px 32px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:10px 20px 24px;display:flex;flex-direction:column;gap:12px">
<div style="align-self:center;width:44px;height:5px;border-radius:99px;background:var(--line)"></div>

<div style="display:flex;align-items:center;justify-content:space-between">
<h2 style="margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em">Outils</h2>
<button aria-label="Fermer les outils" style="width:48px;height:48px;border-radius:16px;border:0;background:var(--surf2);color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div style="display:flex;background:var(--surf2);border-radius:16px;padding:4px;gap:4px">
<button style="flex:1;height:44px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-weight:700;font-size:14px">Coordonnées</button>
<button style="flex:1;height:44px;border:0;border-radius:12px;background:var(--ink);color:var(--surf);font-weight:700;font-size:14px">Unités</button>
</div>

<div style="display:flex;gap:8px">
<button class="chipb" style="background:var(--accSoft);color:var(--acc)">Longueur</button>
<button class="chipb">Vitesse</button>
<button class="chipb">Pression</button>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-family:'Sora',sans-serif;font-weight:700;font-size:46px;letter-spacing:-.03em">120</span><span style="width:2px;height:36px;background:var(--acc);align-self:center"></span></div>
<button style="height:48px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:500;font-size:18px;display:flex;align-items:center;gap:8px">m<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
</div>

<div style="display:flex;flex-direction:column;gap:6px">
<div class="res"><span class="ru">ft</span><span class="rv">393,7</span><button class="cp" aria-label="Copier en pieds"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></div>
<div class="res"><span class="ru">NM</span><span class="rv">0,065</span><button class="cp" aria-label="Copier en milles nautiques"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></div>
<div class="res"><span class="ru">km</span><span class="rv">0,120</span><button class="cp" aria-label="Copier en kilomètres"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></div>
<div class="res"><span class="ru">yd</span><span class="rv">131,2</span><button class="cp" aria-label="Copier en yards"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></div>
</div>

<div style="margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<button class="key">1</button><button class="key">2</button><button class="key">3</button>
<button class="key">4</button><button class="key">5</button><button class="key">6</button>
<button class="key">7</button><button class="key">8</button><button class="key">9</button>
<button class="key">,</button><button class="key">0</button>
<button class="key" aria-label="Effacer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M13 9l4 6M17 9l-4 6"/></svg></button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const base = dark
      ? '--bg:#090D12;--surf:#131A22;--surf2:#1B242E;--line:#2A3541;--ink:#EEF3F7;--mute:#9AA9B8;--acc:#B9F23A;--accInk:#0B1304;--accSoft:#232F0C;--scrim:rgba(0,0,0,.55);'
      : '--bg:#EEF0EA;--surf:#FFFFFF;--surf2:#F2F4EE;--line:#DDE1D6;--ink:#0D1218;--mute:#566170;--acc:#2340E8;--accInk:#FFFFFF;--accSoft:#E3E8FF;--scrim:rgba(13,18,24,.35);';
    return { vars: base };
  }
}
</script>
</body>
</html>
