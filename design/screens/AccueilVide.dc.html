<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil sans mission</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
.pb *{box-sizing:border-box}
.pb button{font-family:inherit;cursor:pointer}
.pb .ibtn{width:48px;height:48px;border-radius:16px;border:0;background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
</style>
</helmet>
<div class="pb" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;{{vars}}">

<div style="position:absolute;left:20px;right:20px;top:24px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:10px">
<div style="width:40px;height:40px;border-radius:14px;background:var(--acc);color:var(--accInk);display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3"/></svg>
</div>
<span style="font-family:'Sora',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em">Prépa Mission</span>
</div>
<div style="display:flex;gap:10px">
<button class="ibtn" aria-label="Changer de thème"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<button class="ibtn" aria-label="Plus d'options"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
</div>
</div>

<div style="position:absolute;left:20px;right:20px;top:92px">
<h1 style="margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:38px;letter-spacing:-.03em;line-height:1.05">Missions</h1>
<div style="margin-top:6px;color:var(--mute);font-weight:600">Aucune mission sur cet appareil</div>
</div>

<div style="position:absolute;left:20px;right:20px;top:230px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px">
<svg width="200" height="150" viewBox="0 0 200 150" aria-hidden="true">
<g fill="none" stroke="var(--field-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="100" cy="75" r="26" stroke-dasharray="5 6"/>
<circle cx="100" cy="75" r="52" stroke-dasharray="5 8" opacity=".6"/>
<circle cx="100" cy="75" r="72" opacity=".3"/>
</g>
<circle cx="100" cy="75" r="9" fill="var(--acc)"/>
<circle cx="100" cy="75" r="16" fill="none" stroke="var(--acc)" stroke-width="2" opacity=".5"/>
</svg>
<div style="font-family:'Sora',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em">Prêt pour une première mission</div>
<div style="color:var(--mute);font-weight:600;line-height:1.5;max-width:300px">Les missions restent dans ce navigateur. Le cache peut être vidé : pensez à les exporter pour les sauvegarder.</div>
</div>

<div style="position:absolute;left:20px;right:20px;bottom:24px;display:flex;flex-direction:column;gap:12px">
<button style="height:56px;border-radius:20px;border:2px solid var(--field-line);background:transparent;color:var(--ink);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>Importer une sauvegarde</button>
<button style="height:64px;border-radius:22px;border:0;background:var(--acc);color:var(--accInk);font-family:'Sora',sans-serif;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nouvelle mission</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const base = dark
      ? '--bg:#090D12;--surf:#131A22;--surf2:#1B242E;--line:#2A3541;--field-line:#6B7C8E;--ink:#EEF3F7;--mute:#9AA9B8;--acc:#B9F23A;--accInk:#0B1304;--shadow:0 6px 24px rgba(0,0,0,.45);'
      : '--bg:#EEF0EA;--surf:#FFFFFF;--surf2:#F2F4EE;--line:#DDE1D6;--field-line:#7B8576;--ink:#0D1218;--mute:#566170;--acc:#2340E8;--accInk:#FFFFFF;--shadow:0 6px 24px rgba(13,18,24,.10);';
    return { vars: base };
  }
}
</script>
</body>
</html>
