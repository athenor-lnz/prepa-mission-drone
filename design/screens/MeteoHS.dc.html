<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Météo indisponible</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
.pb *{box-sizing:border-box}
.pb button{font-family:inherit;cursor:pointer}
.pb .ibtn{width:48px;height:48px;border-radius:16px;border:0;background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.pb .step{width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--surf2);color:var(--mute)}
.pb .lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.pb .mrow{display:flex;align-items:center;gap:8px;min-height:58px}
.pb .stp{width:48px;height:48px;border:0;border-radius:14px;background:var(--surf2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.pb .mv{width:84px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:22px}
.pb .mv small{font-size:13px;color:var(--mute);margin-left:3px}
</style>
</helmet>
<div class="pb" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;{{vars}}">

<div style="position:absolute;left:20px;right:20px;top:24px;display:flex;gap:10px;align-items:center">
<button class="ibtn" aria-label="Retour au lieu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<div style="flex:1;height:48px;border-radius:16px;background:var(--surf);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;padding:0 9px">
<span class="step" style="background:var(--go);color:var(--bg)">✓</span>
<span class="step" style="background:var(--acc);color:var(--accInk)">2</span>
<span style="font-family:'Sora',sans-serif;font-weight:600;font-size:15px;margin:0 6px 0 2px">Météo</span>
<span class="step">3</span><span class="step">4</span>
</div>
</div>

<div style="position:absolute;left:20px;right:20px;top:88px;display:flex;flex-direction:column;gap:10px">

<div style="background:var(--badSoft);border-radius:26px;padding:16px 18px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:14px;align-items:flex-start">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M17 18H7a4 4 0 0 1-.6-8A6 6 0 0 1 18 9.5 4.3 4.3 0 0 1 17 18z"/><path d="M3 3l18 18"/></svg>
<div>
<div style="font-family:'Sora',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--bad)">Météo indisponible</div>
<div style="font-size:14px;font-weight:600;line-height:1.4;margin-top:4px">Source injoignable. Aucune valeur n'est inventée : saisissez les vôtres ci-dessous.</div>
</div>
</div>
<button style="height:52px;border-radius:16px;border:0;background:var(--surf);color:var(--ink);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>Réessayer</button>
</div>

<div style="background:var(--surf);border-radius:24px;box-shadow:var(--shadow);padding:14px 16px">
<div class="lbl" style="margin-bottom:4px">Saisie manuelle</div>
<div class="mrow"><span style="flex:1;font-weight:700">Vent</span>
<button class="stp" aria-label="Vent moins 1 nœud"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
<span class="mv">10<small>kt</small></span>
<button class="stp" aria-label="Vent plus 1 nœud"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button></div>
<div style="height:1px;background:var(--line)"></div>
<div class="mrow"><span style="flex:1;font-weight:700">Rafales</span>
<button class="stp" aria-label="Rafales moins 1 nœud"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
<span class="mv">17<small>kt</small></span>
<button class="stp" aria-label="Rafales plus 1 nœud"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button></div>
<div style="height:1px;background:var(--line)"></div>
<div class="mrow"><span style="flex:1;font-weight:700">Visibilité</span>
<button class="stp" aria-label="Visibilité moins 1 kilomètre"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
<span class="mv">8<small>km</small></span>
<button class="stp" aria-label="Visibilité plus 1 kilomètre"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button></div>
</div>

<div style="background:var(--warnSoft);border-radius:24px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px">
<div>
<div class="lbl" style="color:var(--warn)">Verdict manuel</div>
<div style="font-family:'Sora',sans-serif;font-weight:700;font-size:30px;letter-spacing:-.02em;color:var(--warn);margin-top:2px">LIMITE</div>
</div>
<div style="text-align:right">
<div style="font-family:'JetBrains Mono',monospace;font-weight:500;font-size:20px;white-space:nowrap">17 / 20 kt</div>
<div style="font-size:13px;font-weight:600;color:var(--mute)">85 % du seuil</div>
</div>
</div>

</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to bottom,transparent,var(--bg) 40%)"></div>
<div style="position:absolute;left:20px;right:20px;bottom:24px">
<button style="width:100%;height:64px;border-radius:22px;border:0;background:var(--acc);color:var(--accInk);font-family:'Sora',sans-serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px">Valider · Espace aérien<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const base = dark
      ? '--bg:#090D12;--surf:#131A22;--surf2:#1B242E;--line:#2A3541;--ink:#EEF3F7;--mute:#9AA9B8;--acc:#B9F23A;--accInk:#0B1304;--accSoft:#232F0C;--go:#3EE58C;--goSoft:#0F2E1E;--warn:#FFB020;--warnSoft:#34260A;--bad:#FF7A6E;--badSoft:#3A1814;--shadow:0 6px 24px rgba(0,0,0,.45);'
      : '--bg:#EEF0EA;--surf:#FFFFFF;--surf2:#F2F4EE;--line:#DDE1D6;--ink:#0D1218;--mute:#566170;--acc:#2340E8;--accInk:#FFFFFF;--accSoft:#E3E8FF;--go:#0D7A40;--goSoft:#D8F1E1;--warn:#8A5200;--warnSoft:#FBE9C6;--bad:#B3261E;--badSoft:#F9DAD6;--shadow:0 6px 24px rgba(13,18,24,.10);';
    return { vars: base };
  }
}
</script>
</body>
</html>
