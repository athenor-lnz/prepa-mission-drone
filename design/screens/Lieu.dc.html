<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lieu de la mission</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
.pb *{box-sizing:border-box}
.pb button{font-family:inherit;cursor:pointer}
.pb .ibtn{width:48px;height:48px;border-radius:16px;border:0;background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.pb .step{width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--surf2);color:var(--mute)}
</style>
</helmet>
<div class="pb" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;{{vars}}">

<svg width="390" height="500" viewBox="0 0 390 500" style="position:absolute;left:0;top:0" aria-label="Carte du lieu" role="img">
<rect width="390" height="500" fill="var(--mLand)"/>
<polygon points="0,60 120,40 150,140 40,170 0,150" fill="var(--mGreen)"/>
<polygon points="250,300 390,280 390,430 280,440" fill="var(--mGreen)"/>
<rect x="60" y="300" width="70" height="46" fill="var(--mGreen2)" transform="rotate(-8 95 323)"/>
<rect x="140" y="320" width="70" height="46" fill="var(--mGreen)" transform="rotate(-8 175 343)"/>
<rect x="30" y="360" width="90" height="50" fill="var(--mGreen)" transform="rotate(-8 75 385)"/>
<path d="M-10 420 C 90 380, 150 460, 250 420 S 380 380, 400 400" stroke="var(--mWater)" stroke-width="30" fill="none" stroke-linecap="round"/>
<path d="M-10 200 L 400 150" stroke="var(--mCase)" stroke-width="12" fill="none"/>
<path d="M-10 200 L 400 150" stroke="var(--mRoad)" stroke-width="8" fill="none"/>
<path d="M210 -10 L 180 300 L 150 520" stroke="var(--mCase)" stroke-width="12" fill="none"/>
<path d="M210 -10 L 180 300 L 150 520" stroke="var(--mRoad)" stroke-width="8" fill="none"/>
<path d="M-10 290 L 400 250" stroke="var(--mCase)" stroke-width="8" fill="none"/>
<path d="M-10 290 L 400 250" stroke="var(--mRoad)" stroke-width="5" fill="none"/>
<rect x="224" y="188" width="26" height="18" fill="var(--mBldg)"/>
<rect x="256" y="176" width="22" height="22" fill="var(--mBldg)"/>
<rect x="288" y="168" width="30" height="18" fill="var(--mBldg)"/>
<rect x="230" y="214" width="20" height="16" fill="var(--mBldg)"/>
<rect x="150" y="210" width="22" height="22" fill="var(--mBldg)"/>
<rect x="116" y="216" width="26" height="16" fill="var(--mBldg)"/>
<circle cx="195" cy="238" r="66" fill="var(--acc)" fill-opacity=".16" stroke="var(--acc)" stroke-width="2.5" stroke-dasharray="7 6"/>
<circle cx="195" cy="238" r="11" fill="var(--acc)" stroke="var(--surf)" stroke-width="4"/>
</svg>

<div style="position:absolute;left:20px;right:20px;top:24px;display:flex;gap:10px;align-items:center">
<button class="ibtn" aria-label="Retour aux missions"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<div style="flex:1;height:48px;border-radius:16px;background:var(--surf);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;padding:0 9px">
<span class="step" style="background:var(--acc);color:var(--accInk)">1</span>
<span style="font-family:'Sora',sans-serif;font-weight:600;font-size:15px;margin:0 6px 0 2px">Lieu</span>
<span class="step">2</span><span class="step">3</span><span class="step">4</span>
</div>
</div>

<div style="position:absolute;right:20px;top:296px;display:flex;flex-direction:column;gap:10px">
<button class="ibtn" aria-label="Me localiser"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
</div>
<div style="position:absolute;left:20px;top:400px;height:48px;border-radius:16px;background:var(--surf);box-shadow:var(--shadow);display:flex;padding:4px;gap:4px">
<button style="border:0;border-radius:12px;padding:0 16px;font-size:14px;font-weight:700;background:{{planBg}};color:{{planFg}}">Plan</button>
<button style="border:0;border-radius:12px;padding:0 16px;font-size:14px;font-weight:700;background:{{satBg}};color:{{satFg}}">Satellite</button>
</div>
<div style="position:absolute;left:20px;top:372px;font-size:11px;font-weight:600;color:var(--ink);background:var(--surf);padding:2px 8px;border-radius:8px;opacity:.9">Rayon 100 m</div>

<div style="position:absolute;left:0;right:0;top:468px;bottom:0;background:var(--surf);border-radius:32px 32px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.14);padding:10px 20px 24px;display:flex;flex-direction:column;gap:12px">
<div style="align-self:center;width:44px;height:5px;border-radius:99px;background:var(--line)"></div>

<div style="display:flex;align-items:center;gap:10px;height:56px;border-radius:18px;background:var(--surf2);padding:0 6px 0 16px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--mute)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<span style="flex:1;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Adresse ou coordonnées</span>
<button aria-label="Dicter l'adresse" style="width:44px;height:44px;border-radius:14px;border:0;background:var(--accSoft);color:var(--acc);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
</div>

<div style="display:flex;background:var(--surf2);border-radius:16px;padding:4px;gap:4px">
<button style="flex:1;height:44px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-weight:700;font-size:14px">DD</button>
<button style="flex:1;height:44px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-weight:700;font-size:14px">DDM</button>
<button style="flex:1;height:44px;border:0;border-radius:12px;background:var(--ink);color:var(--surf);font-weight:700;font-size:14px">DMS</button>
<button style="flex:1;height:44px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-weight:700;font-size:14px">UTM</button>
</div>

<div style="display:flex;align-items:center;gap:12px;padding:14px 8px 14px 16px;border-radius:20px;border:1.5px solid var(--line)">
<div style="flex:1;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:19px;line-height:1.45">N 43° 36′ 16.20″<br>E 1° 26′ 39.12″</div>
<button aria-label="Copier les coordonnées" style="width:56px;height:56px;border-radius:18px;border:0;background:var(--accSoft);color:var(--acc);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
</div>

<div style="margin-top:auto;display:flex;gap:12px">
<button aria-label="Ouvrir les outils" style="width:64px;height:64px;border-radius:22px;border:0;background:var(--surf2);color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7 6.3 21l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></button>
<button style="flex:1;height:64px;border-radius:22px;border:0;background:var(--acc);color:var(--accInk);font-family:'Sora',sans-serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px">Valider · Météo<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const base = dark
      ? '--bg:#090D12;--surf:#131A22;--surf2:#1B242E;--line:#2A3541;--ink:#EEF3F7;--mute:#9AA9B8;--acc:#B9F23A;--accInk:#0B1304;--accSoft:#232F0C;--go:#3EE58C;--goSoft:#0F2E1E;--warn:#FFB020;--warnSoft:#34260A;--bad:#FF7A6E;--badSoft:#3A1814;--shadow:0 6px 24px rgba(0,0,0,.45);--mLand:#26341F;--mGreen:#2E4326;--mGreen2:#1E2B18;--mWater:#16293A;--mRoad:#7C8A78;--mCase:#141C11;--mBldg:#4B5148;'
      : '--bg:#EEF0EA;--surf:#FFFFFF;--surf2:#F2F4EE;--line:#DDE1D6;--ink:#0D1218;--mute:#566170;--acc:#2340E8;--accInk:#FFFFFF;--accSoft:#E3E8FF;--go:#0D7A40;--goSoft:#D8F1E1;--warn:#8A5200;--warnSoft:#FBE9C6;--bad:#B3261E;--badSoft:#F9DAD6;--shadow:0 6px 24px rgba(13,18,24,.10);--mLand:#E9E6DC;--mGreen:#CFE3C2;--mGreen2:#C3DAB4;--mWater:#A9CDE8;--mRoad:#FFFFFF;--mCase:#D2CDBF;--mBldg:#D8D3C6;';
    return {
      vars: base,
      planBg: dark ? 'transparent' : 'var(--ink)',
      planFg: dark ? 'var(--mute)' : 'var(--surf)',
      satBg: dark ? 'var(--ink)' : 'transparent',
      satFg: dark ? 'var(--surf)' : 'var(--mute)'
    };
  }
}
</script>
</body>
</html>
