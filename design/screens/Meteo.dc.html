<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Météo du créneau</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
.pb *{box-sizing:border-box}
.pb button{font-family:inherit;cursor:pointer}
.pb .ibtn{width:48px;height:48px;border-radius:16px;border:0;background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.pb .step{width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--surf2);color:var(--mute)}
.pb .lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.pb .tile{flex:1;background:var(--surf);border-radius:20px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:2px}
.pb .tv{font-family:'Sora',sans-serif;font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.pb .tv small{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:13px;color:var(--mute);letter-spacing:0;margin-left:3px}
.pb .col{flex:1;height:112px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.pb .bar{width:20px;border-radius:7px 7px 3px 3px}
.pb .hr{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:12px;color:var(--mute)}
.pb .stp{width:46px;height:52px;border:0;border-radius:14px;background:var(--surf2);color:var(--ink);display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="pb" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;{{vars}}">

<div style="position:absolute;left:20px;right:20px;top:24px;display:flex;gap:10px;align-items:center">
<button class="ibtn" aria-label="Retour au lieu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<div style="flex:1;height:48px;border-radius:16px;background:var(--surf);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;padding:0 9px">
<span class="step" style="background:var(--go);color:var(--bg)">✓</span>
<span class="step" style="background:var(--acc);color:var(--accInk)">2</span>
<span style="font-family:'Sora',sans-serif;font-weight:600;font-size:15px;margin:0 6px 0 2px">Météo</span>
<span class="step">3</span><span class="step">4</span>
</div>
</div>

<div style="position:absolute;left:20px;right:20px;top:88px;display:flex;flex-direction:column;gap:10px">

<div style="background:var(--goSoft);border-radius:26px;padding:16px 18px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<span class="lbl" style="color:var(--go)">Créneau 14:00 – 16:30</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mute)">maj 14:32</span>
</div>
<div style="display:flex;align-items:flex-end;justify-content:space-between">
<span style="font-family:'Sora',sans-serif;font-weight:700;font-size:60px;letter-spacing:-.04em;line-height:.95;color:var(--go)">GO</span>
<div style="text-align:right;padding-bottom:4px">
<div style="font-family:'JetBrains Mono',monospace;font-weight:500;font-size:20px;color:var(--ink)">14 / 20 kt</div>
<div style="font-size:13px;font-weight:600;color:var(--mute)">rafales max · seuil</div>
</div>
</div>
<div>
<div style="position:relative;height:12px;border-radius:99px;background:var(--surf)">
<div style="position:absolute;left:0;top:0;bottom:0;width:70%;border-radius:99px;background:var(--go)"></div>
<div style="position:absolute;left:85%;top:-3px;width:3px;height:18px;border-radius:2px;background:var(--ink)"></div>
</div>
<div style="margin-top:6px;font-size:13px;font-weight:600;color:var(--mute)">70 % du seuil · « Limite » à partir de 85 %</div>
</div>
</div>

<div style="display:flex;gap:10px">
<div class="tile"><span class="lbl">Vent</span><span class="tv">9<small>kt</small></span><span style="font-size:13px;font-weight:600;color:var(--mute)">SO · 230°</span></div>
<div class="tile"><span class="lbl">Rafales</span><span class="tv">14<small>kt</small></span><span style="font-size:13px;font-weight:600;color:var(--mute)">max créneau</span></div>
<div class="tile"><span class="lbl">Kp</span><span class="tv">2<small>/9</small></span><span style="font-size:13px;font-weight:600;color:var(--go)">calme</span></div>
</div>

<div style="background:var(--surf);border-radius:24px;box-shadow:var(--shadow);padding:14px 12px 10px;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;justify-content:space-between;align-items:center;padding:0 6px">
<span class="lbl">Rafales · seuil</span>
<div style="display:flex;align-items:center;gap:4px">
<button class="stp" aria-label="Seuil de rafales moins 1 nœud" style="width:44px;height:44px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
<span style="font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;min-width:58px;text-align:center">20 kt</span>
<button class="stp" aria-label="Seuil de rafales plus 1 nœud" style="width:44px;height:44px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
</div>
</div>
<div style="position:relative;display:flex">
<div style="position:absolute;left:0;right:0;bottom:{{thrBottom}}px;border-top:2px dashed var(--bad);opacity:.7;z-index:2"></div>
<div class="col"><div class="bar" style="height:36px;background:var(--go);opacity:.45"></div></div>
<div class="col"><div class="bar" style="height:44px;background:var(--go);opacity:.45"></div></div>
<div class="col" style="background:var(--accSoft);border-radius:14px 0 0 14px"><div class="bar" style="height:48px;background:var(--go)"></div></div>
<div class="col" style="background:var(--accSoft)"><div class="bar" style="height:56px;background:var(--go)"></div></div>
<div class="col" style="background:var(--accSoft);border-radius:0 14px 14px 0"><div class="bar" style="height:52px;background:var(--go)"></div></div>
<div class="col"><div class="bar" style="height:76px;background:var(--warn);opacity:.7"></div></div>
<div class="col"><div class="bar" style="height:88px;background:var(--bad);opacity:.7"></div></div>
<div class="col"><div class="bar" style="height:72px;background:var(--warn);opacity:.7"></div></div>
</div>
<div style="display:flex">
<span class="hr" style="flex:1;text-align:center">12</span><span class="hr" style="flex:1;text-align:center">13</span><span class="hr" style="flex:1;text-align:center;color:var(--ink)">14</span><span class="hr" style="flex:1;text-align:center;color:var(--ink)">15</span><span class="hr" style="flex:1;text-align:center;color:var(--ink)">16</span><span class="hr" style="flex:1;text-align:center">17</span><span class="hr" style="flex:1;text-align:center">18</span><span class="hr" style="flex:1;text-align:center">19</span>
</div>
</div>

<div style="display:flex;align-items:center;gap:12px;background:var(--warnSoft);color:var(--warn);border-radius:20px;padding:12px 16px;min-height:56px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>
<span style="font-size:14px;font-weight:700;line-height:1.3">Vigilance jaune orages dès 17:00, après la fin du créneau</span>
</div>

</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:176px;background:var(--bg)"></div>
<div style="position:absolute;left:20px;right:20px;bottom:24px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:10px">
<div style="flex:1;background:var(--surf);border-radius:22px;box-shadow:var(--shadow);padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px">
<span class="lbl">Début</span>
<div style="display:flex;align-items:center;width:100%;justify-content:space-between">
<button class="stp" aria-label="Début moins 30 minutes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
<span style="font-family:'JetBrains Mono',monospace;font-weight:500;font-size:22px">14:00</span>
<button class="stp" aria-label="Début plus 30 minutes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
</div>
</div>
<div style="flex:1;background:var(--surf);border-radius:22px;box-shadow:var(--shadow);padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px">
<span class="lbl">Fin</span>
<div style="display:flex;align-items:center;width:100%;justify-content:space-between">
<button class="stp" aria-label="Fin moins 30 minutes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
<span style="font-family:'JetBrains Mono',monospace;font-weight:500;font-size:22px">16:30</span>
<button class="stp" aria-label="Fin plus 30 minutes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
</div>
</div>
</div>
<button style="height:64px;border-radius:22px;border:0;background:var(--acc);color:var(--accInk);font-family:'Sora',sans-serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px">Valider · Espace aérien<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const base = dark
      ? '--bg:#090D12;--surf:#131A22;--surf2:#1B242E;--line:#2A3541;--ink:#EEF3F7;--mute:#9AA9B8;--acc:#B9F23A;--accInk:#0B1304;--accSoft:#232F0C;--go:#3EE58C;--goSoft:#0F2E1E;--warn:#FFB020;--warnSoft:#34260A;--bad:#FF7A6E;--badSoft:#3A1814;--shadow:0 6px 24px rgba(0,0,0,.45);'
      : '--bg:#EEF0EA;--surf:#FFFFFF;--surf2:#F2F4EE;--line:#DDE1D6;--ink:#0D1218;--mute:#566170;--acc:#2340E8;--accInk:#FFFFFF;--accSoft:#E3E8FF;--go:#0D7A40;--goSoft:#D8F1E1;--warn:#8A5200;--warnSoft:#FBE9C6;--bad:#B3261E;--badSoft:#F9DAD6;--shadow:0 6px 24px rgba(13,18,24,.10);';
    return { vars: base, thrBottom: 80 };
  }
}
</script>
</body>
</html>
