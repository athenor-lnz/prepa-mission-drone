name: CI

on:
  push:
    branches: [design-b-mobile]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: npm test
